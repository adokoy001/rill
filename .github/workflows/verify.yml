name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: rust:1.95.0-trixie@sha256:f49565f188ee00bc2a18dd418183f2c5f23ef7d6e691890517ed341a598f67c3
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install verification tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 openssl curl cmake pkg-config libssl-dev
          rustup component add rustfmt clippy
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
          cargo install --locked cargo-audit --version 0.23.0
      - name: Check release
        run: ./verification/verify.sh
